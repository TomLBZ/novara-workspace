# =============================================================================
#  WORKSPACE CONFIGURATION  --  <workspace>/config.yaml
# =============================================================================
#  Single source of truth for this workspace: git credentials, git identity,
#  API keys and the LLM/model defaults. Everything else in the workspace is
#  self-contained and needs no configuration at all.
#
#  Read it with the bundled CLI (from any shell):
#     ws-config show                     # whole file, secrets redacted
#     ws-config get api_keys.openai.value --reveal
#     ws-config export                   # eval "$(ws-config export)"
#     ws-config env-file .env            # write a chmod-600 .env
#     ws-config git-setup                # render config/gitconfig + credentials
#     ws-config llm                      # resolved model / reasoning settings
#     ws-config validate                 # structure + placeholder check
#
#  Or from python (venv already has PyYAML):
#     from wsconfig import load, get
#     get(load(), "api_keys.openai.value")
#
#  WHERE DO I CHANGE WHAT?
#    here (config.yaml)      api keys, git credentials + identity, LLM settings,
#                            dashboard.admin_token and vscode.password (see below)
#    services/services.json  which services run, their ports / health paths / logs,
#                            the router's route table, and per-service settings
#                            (e.g. dashboard.settings.files.*, vscode.settings.trusted_origins)
#    Nothing is configured in two files. `ws-config show` redacts secrets; the
#    manifest is validated by `ws-gateway validate`.
#
#  SECURITY: this file holds secrets -> mode 0600, and it is listed in
#  .gitignore so it can never be committed by accident.
# =============================================================================

apiVersion: ws/v1

meta:
  owner: hermes
  purpose: supply-chain agent workspace
  created: "2026-09-11"
  notes: >-
    Placeholders below are filled in by the user as credentials become
    available. Empty fields are harmless: tools simply report them as missing.

# --- where things live -------------------------------------------------------
# Informational only. The live values are always derived from bin/activate.sh,
# so the workspace keeps working after being moved / bind-mounted elsewhere.
paths:
  root: /workspace
  runtime: runtime/
  venv: venvs/py
  python: runtime/python          # uv-managed CPython (3.13 default, 3.12 also)
  node: runtime/node              # LTS 24.21.0 (current) + 26.8.2
  git: runtime/git                # self-contained git + https/ca-certificates
  uv: runtime/uv/bin/uv

# --- git ---------------------------------------------------------------------
git:
  identity:
    name: ""                      # e.g. "Liang Zi"        -> [user] name
    email: ""                     # e.g. "liangzi@corp.com" -> [user] email
  default_branch: main
  # One entry per host; `ws-config git-setup` renders them into
  # config/git-credentials (mode 0600) behind git's `store` credential helper.
  credentials:
    - id: github
      host: github.com
      protocol: https             # https | ssh
      username: ""                # GitHub username; for a PAT also "x-access-token"
      token: ""                   # PAT / fine-grained token / app token
      ssh_key: ""                 # optional private key path, e.g. config/keys/id_ed25519
      notes: ""
    - id: other
      host: ""                    # e.g. gitlab.internal.corp, bitbucket.org
      protocol: https
      username: ""
      token: ""
      ssh_key: ""
      notes: ""
  # Optional raw settings, applied verbatim as `section.key = value`
  config:
    init.defaultBranch: main
    # bind-mounted workspaces usually have a foreign owner uid; without this
    # git refuses to operate ("dubious ownership")
    safe.directory: "*"
    # core.editor: vim
    # pull.rebase: "false"

# --- LLM defaults ------------------------------------------------------------
# Which provider/model this workspace's agents use, and how hard the model should
# think. Only `provider` and `reasoning_effort` matter; the rest has defaults.
#     ws-config llm                   # resolved settings (human readable)
#     ws-config llm --request         # the chat-completions body that would be sent
#     eval "$(ws-config export)"      # LLM_PROVIDER / LLM_MODEL / LLM_REASONING_* ...
#     python -c "from wsconfig import llm_settings, build_chat_request; print(llm_settings())"
llm:
  provider: deepseek              # must be a key of api_keys below
  fallbacks: []                   # e.g. [openai, anthropic] - tried in order
  model: ""                       # empty -> api_keys.<provider>.default_model
  reasoning_effort: medium        # THE reasoning knob
                                  #   none | null | ""        -> thinking/reasoning OFF
                                  #   a level the provider has -> sent as-is
                                  #     (minimal | low | medium | high)
                                  #   a level it does not have -> nearest supported one
                                  #     (xhigh | ultra | ... -> high)
  timeout_s: 300                  # seconds per request
  retries: 2
  # max_tokens: 32000             # optional cost ceiling; absent = provider default
  extra_body: {}                  # escape hatch: verbatim extra JSON fields

# --- API keys + endpoint per provider ----------------------------------------
# Every block uses the same fields; only the first four are normally filled in:
#
#   value          the secret
#   env            variable name exported by `ws-config export`
#   base_url       endpoint (empty -> provider default)
#   default_model  model id used unless llm.model overrides it
#   kind           openai-compatible (default) | anthropic | gemini
#   extra_body     optional verbatim extra JSON fields
#
# Model ids are discovered from the endpoint itself (`GET /v1/models` -> e.g.
# deepseek-flash, deepseek-v4-pro), so there is no list to keep in sync here. How
# the reasoning knob is spelled, and which levels exist, follows `kind` and lives
# in tools/wsconfig.py (KIND_DIALECTS) - measured against the live API, not guessed.
#
# Non-LLM service keys (tavily, slack, ...) only need value/env/base_url.
api_keys:
  # --- the provider this workspace uses ------------------------------------
  deepseek:
    value: ""
    env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-flash        # this endpoint also serves deepseek-v4-pro
  # --- optional providers: same fields, add one when you have a key --------
  openai:     { value: "", env: OPENAI_API_KEY,    base_url: "", default_model: "" }
  anthropic:  { value: "", env: ANTHROPIC_API_KEY, base_url: "", default_model: "", kind: anthropic }
  gemini:     { value: "", env: GEMINI_API_KEY,    base_url: "", default_model: "", kind: gemini }
  # --- non-LLM service keys ------------------------------------------------
  tavily:     { value: "", env: TAVILY_API_KEY,    base_url: "" }
  slack:      { value: "", env: SLACK_BOT_TOKEN,   base_url: "" }
  # add more as needed, e.g.:
  # aws:      { value: "", env: AWS_SECRET_ACCESS_KEY, base_url: "" }
# --- free-form secrets -------------------------------------------------------
# Anything not covered above. Keys are used verbatim as environment-variable
# names by `ws-config export`.
secrets: {}
  # INTERNAL_ERP_TOKEN: ""
  # SMTP_PASSWORD: ""

# --- dashboard (ws-dashboard service) ----------------------------------------
# The dashboard's file browser has two scopes: without a token it browses
# services/services.json -> dashboard.settings.files.root (default "projects"),
# with the token it widens to the workspace root. Secrets stay denied in both.
#
#   admin_token: ""          let the service generate config/dashboard-admin-token
#                            (mode 0600, gitignored) on first start - read it with
#                            services/dashboard/dashboard.py --files-token
#   admin_token: "<value>"   that exact string is required; any non-empty string
#                            works (>= 16 chars recommended). Quote it if it starts
#                            with a YAML special character or contains ": ".
# Rotate by editing this value, or with
# services/dashboard/dashboard.py --files-token --rotate.
dashboard:
  admin_token: ""

# --- VS Code in the browser (ws-vscode service) ------------------------------
# services/services.json -> vscode.settings.trusted_origins lists the hostnames the
# editor accepts websocket upgrades from: it must contain every host you open
# /vscode from, otherwise the page loads but the workbench never connects.
#
#   password: ""             let the service generate config/vscode-password
#                            (mode 0600, gitignored) on first start - read it with
#                            services/vscode/vscode.py --password
#   password: "<value>"      that exact string is the editor's login password.
# Rotate with services/vscode/vscode.py --password --rotate.
vscode:
  password: ""


# --- networking --------------------------------------------------------------
proxy:
  http: ""                        # e.g. http://proxy.corp:8080  ("" = direct)
  https: ""
  no_proxy: ""

# --- behaviour flags ---------------------------------------------------------
flags:
  auto_export_api_keys: false     # true -> activate.sh exports api_keys on shell start
  git_config_scope: global        # workspace-local global gitconfig (config/gitconfig)
